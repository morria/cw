name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-macos:
    name: Build & Test (macOS)
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    # Use the Xcode-bundled Swift; installing a separate open-source
    # toolchain breaks against newer SDKs on the hosted runners.
    - name: Swift version
      run: swift --version
    - name: Build
      run: swift build --build-tests
    - name: Test
      run: swift test

  test-linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: swift-actions/setup-swift@v2
      with:
        swift-version: '6.1'
    - name: Build
      run: swift build --build-tests
    - name: Test
      run: swift test
